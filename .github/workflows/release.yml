name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Compute Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Generate CalVer Version
        id: version
        run: |
          VERSION=$(date -u +"%Y.%m.%d.%H%M")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION} (tag: ${TAG})"

  release-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            task: ':app-compose:releaseLinuxX64'
          - arch: arm64
            runner: ubuntu-24.04-arm
            task: ':app-compose:releaseLinuxArm64'
    runs-on: ${{ matrix.runner }}
    env:
      OPENAQUA_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Install Linux AppImage packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file libasound2-dev

      - name: Build & Package Release Artifacts
        run: ./gradlew ${{ matrix.task }} --scan --stacktrace

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux-${{ matrix.arch }}
          path: build/releases/*
          if-no-files-found: error

      - name: Upload Packaging Descriptors
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: packaging-descriptors
          path: app-compose/build/generated/packaging
          if-no-files-found: error

  release-windows:
    name: Build Windows Packages
    needs: prepare
    runs-on: windows-latest
    env:
      OPENAQUA_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Build & Package Release Artifacts
        run: ./gradlew :app-compose:releaseMingwX64 --scan --stacktrace

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: build/releases/*
          if-no-files-found: error

  create-release:
    name: Tag & Create GitHub Release
    needs: [prepare, release-linux, release-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Tag Commit & Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.prepare.outputs.tag }}" \
            --generate-notes

  publish-windows-store:
    name: Publish to Microsoft Store
    needs: [create-release, release-windows]
    runs-on: windows-latest
    steps:
      - name: Download Windows Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets

      - name: Resolve MSIX Package for Store Deployment
        if: env.MICROSOFT_CLIENT_SECRET != ''
        id: resolve_msix
        shell: pwsh
        env:
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          $deployDir = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/msix-deploy" -Force
          $msix = Get-ChildItem "release-assets" -Filter "*.msix" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msix) {
            throw "No MSIX package found in release-assets"
          }
          Copy-Item $msix.FullName -Destination $deployDir.FullName
          Write-Host "Resolved MSIX directory for deployment: $($deployDir.FullName) with package $($msix.Name)"
          echo "msix_dir=$($deployDir.FullName)" >> $env:GITHUB_OUTPUT

      - name: Deploy to Microsoft Store
        if: env.MICROSOFT_CLIENT_SECRET != ''
        continue-on-error: true
        uses: isaacrlevin/windows-store-action@1.0
        env:
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        with:
          tenant-id: ${{ secrets.MICROSOFT_TENANT_ID }}
          client-id: ${{ secrets.MICROSOFT_CLIENT_ID }}
          client-secret: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          app-id: ${{ secrets.MICROSOFT_STORE_ID }}
          package-path: ${{ steps.resolve_msix.outputs.msix_dir }}

  publish-linux-stores:
    name: Publish to Linux Stores
    needs: [prepare, create-release, release-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SNAP_TOKEN: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - name: Download Packaging Descriptors
        uses: actions/download-artifact@v4
        with:
          name: packaging-descriptors
          path: generated-packaging

      - name: Download Linux x64 Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets-linux-x64
          path: release-assets

      - name: Sync Flathub Repository
        if: env.FLATHUB_TOKEN != ''
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_PUSH_TOKEN }}
        run: |
          echo "Syncing Flathub repository (io.github.lamba92.openaqua)..."
          git clone "https://x-access-token:${FLATHUB_TOKEN}@github.com/flathub/io.github.lamba92.openaqua.git" flathub-repo || {
            echo "::warning::Flathub repository clone failed. Verify FLATHUB_PUSH_TOKEN and repository status."
            exit 0
          }
          cd flathub-repo
          cp ../generated-packaging/flatpak/io.github.lamba92.openaqua.yaml .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to version ${VERSION}" || echo "No changes to commit"
          git push origin master

      - name: Publish to Arch Linux (AUR)
        if: env.AUR_KEY != ''
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          echo "Deploying to AUR (open-aqua-bin)..."
          mkdir -p ~/.ssh
          echo "${AUR_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git clone "ssh://aur@aur.archlinux.org/open-aqua-bin.git" aur-repo || {
            echo "::warning::AUR clone failed (account registration may be pending or closed). Skipping AUR publishing."
            exit 0
          }
          cd aur-repo
          cp ../generated-packaging/aur/PKGBUILD .
          git config user.name "Lamberto Basti"
          git config user.email "basti.lamberto@gmail.com"
          git commit -am "Update open-aqua-bin to ${VERSION}" || echo "No changes to commit"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master

      - name: Prepare Snap Build Directory
        if: env.SNAP_TOKEN != ''
        run: |
          echo "Preparing Snap payload..."
          mkdir -p /tmp/snap-payload
          cp generated-packaging/snap/snapcraft.yaml /tmp/snap-payload/
          tar -xzf "release-assets/open-aqua-${VERSION}-linux-x64.tar.gz" -C /tmp/snap-payload/ --strip-components=1

      - name: Install Snapcraft
        if: env.SNAP_TOKEN != ''
        run: sudo snap install snapcraft --classic

      - name: Build Snap Package
        if: env.SNAP_TOKEN != ''
        id: snap_build
        run: |
          cd /tmp/snap-payload
          sudo snapcraft pack --destructive-mode
          SNAP_PATH=$(ls /tmp/snap-payload/*.snap | head -n 1)
          echo "snap=${SNAP_PATH}" >> "$GITHUB_OUTPUT"
          echo "Built snap: ${SNAP_PATH}"

      - name: Publish Snap to Snap Store
        if: env.SNAP_TOKEN != ''
        uses: snapcore/action-publish@v1
        env:
          SNAP_TOKEN: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap_build.outputs.snap }}
          release: stable
