name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to upload to (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: Linux
            task: releaseLinux
          - os: windows-latest
            os_name: Windows
            task: releaseWindows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - run: chmod +x gradlew

      - name: Build release assets
        run: ./gradlew ${{ matrix.task }} --stacktrace

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.tag_name || github.ref_name }}" build/releases/* --clobber
